name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint Dockerfile and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Validate Kubernetes manifests
        run: bash scripts/validate-manifests.sh

  image:
    name: Build, test and publish image
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # The Dockerfile's test stage runs the unit tests with the tool chain
      # of the build image, so the runner needs no language setup.
      - name: Unit tests
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: app:ci
          cache-from: type=gha

      # The image exposes the port the service listens on; Docker maps it to
      # a free port on the runner.
      - name: Start the container and call the probes
        run: |
          docker run --detach --name app --publish-all app:ci
          address="$(docker port app | head -n 1 | awk '{ print $NF }')"
          for _ in $(seq 1 30); do
            if curl --fail --silent "http://$address/health" && curl --fail --silent "http://$address/ready"; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs app
          exit 1

      - name: Log in to the GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image names and tags
        id: meta
        if: github.event_name == 'push'
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Publish
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
