name: Code quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  settings:
    name: Check SonarQube settings
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The SonarQube analysis is skipped. Set the repository secret SONAR_TOKEN (and the variable SONAR_HOST_URL for SonarQube Server) to enable it."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  sonarqube:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    needs: settings
    if: needs.settings.outputs.configured == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          # The analysis uses the history to attribute issues to changes.
          fetch-depth: 0

      # Reads sonar-project.properties. Without SONAR_HOST_URL the results go
      # to SonarQube Cloud.
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
