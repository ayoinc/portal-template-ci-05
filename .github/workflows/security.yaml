name: Security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Trivy reports and does not fail the build: its advisory and check databases
# change daily, so the same commit would pass one day and fail the next.
jobs:
  manifests:
    name: Manifests and dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Trivy report of Kubernetes and Dockerfile misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH,MEDIUM

      - name: Trivy report of vulnerable dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH

      # Code scanning accepts uploads from public repositories without setup.
      - name: Trivy misconfiguration report for the Security tab
        if: github.event_name == 'push' && !github.event.repository.private
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif

      - name: Upload the report to the Security tab
        if: github.event_name == 'push' && !github.event.repository.private
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: app:scan
          cache-from: type=gha

      - name: Trivy report of vulnerabilities in the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: app:scan
          format: table
          severity: CRITICAL,HIGH
