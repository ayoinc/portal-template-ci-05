apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sample-orders-service
  labels:
    app.kubernetes.io/name: sample-orders-service
    backstage.io/kubernetes-id: sample-orders-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sample-orders-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
