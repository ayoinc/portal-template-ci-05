apiVersion: v1
kind: Namespace
metadata:
  name: orders
  labels:
    app.kubernetes.io/part-of: sample-orders-service
    # Pod Security Admission rejects pods that do not meet the restricted
    # profile: non-root, no privilege escalation, no added capabilities.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
