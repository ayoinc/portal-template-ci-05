apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: orders-dev

resources:
  - ../../base

patches:
  - target:
      kind: ConfigMap
      name: sample-orders-service-config
    patch: |-
      - op: replace
        path: /data/ENVIRONMENT
        value: dev
  - target:
      kind: Ingress
      name: sample-orders-service
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: sample-orders-service-dev.example.com
  - target:
      kind: HorizontalPodAutoscaler
      name: sample-orders-service
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
