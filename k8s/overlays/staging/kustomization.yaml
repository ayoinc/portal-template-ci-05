apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: orders-staging

resources:
  - ../../base

patches:
  - target:
      kind: ConfigMap
      name: sample-orders-service-config
    patch: |-
      - op: replace
        path: /data/ENVIRONMENT
        value: staging
  - target:
      kind: Ingress
      name: sample-orders-service
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: sample-orders-service-staging.example.com
  - target:
      kind: HorizontalPodAutoscaler
      name: sample-orders-service
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4
